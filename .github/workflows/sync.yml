name: mangabox-sync

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "arguments"
        default: "--all"

concurrency:
  group: mangabox-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          RUN_ARGS: ${{ github.event.inputs.args || '--all' }}
        run: python mangabox_to_telegram.py $RUN_ARGS --max-minutes 320 --workers 4
      - name: Save progress
        if: always()
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          if [ -f progress.json ]; then git add progress.json; fi
          if [ -f manhwa_map.json ]; then git add manhwa_map.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "update progress"
            git pull --rebase
            git push
          fi
