name: mangabox-sync

on:
  schedule:
    - cron: "7 * * * *"        # هر ساعت؛ اگر اجرای قبلی هنوز در جریان باشد، بعد از تمام شدنش شروع می‌شود
  workflow_dispatch:
    inputs:
      args:
        description: "آرگومان‌ها (برای تست: --slug black-haze --chapters 1)"
        default: "--all"

concurrency:
  group: mangabox-sync
  cancel-in-progress: false    # دو اجرا هم‌زمان نشوند

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RUN_ARGS: ${{ github.event.inputs.args || '--all' }}
        run: python mangabox_to_telegram.py $RUN_ARGS --max-minutes 320 --workers 4
